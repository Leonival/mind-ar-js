<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exercise 3 - Multi-Target WebAR</title>
    <!-- Load A-Frame core library -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- Load animation extras library (supports built-in animations for glTF models) -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <!-- Load MindAR A-Frame adapter library -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    
    <!-- AR Scene configuration: load targets.mind from assets, maxTrack: 2 allows tracking multiple targets simultaneously -->
    <a-scene 
      mindar-image="imageTargetSrc: ./assets/targets.mind; maxTrack: 2;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Preload the two glb models from the assets folder -->
        <a-asset-item id="arrow1Model" src="./assets/arrow1.glb"></a-asset-item>
        <a-asset-item id="arrow2Model" src="./assets/arrow2.glb"></a-asset-item>
      </a-assets>

      <!-- Camera component -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0: Corresponds to the first uploaded image (carto.jpg) during compilation -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Render arrow1.glb model with adjusted scale 0.1 -->
        <a-gltf-model 
          rotation="0 0 0" 
          position="0 0 0" 
          scale="1 1 1" 
          src="#arrow1Model" 
          animation-mixer>
        </a-gltf-model>
      </a-entity>

      <!-- Target 1: Corresponds to the second uploaded image (tum.jpg) during compilation -->
      <a-entity mindar-image-target="targetIndex: 1">
        <!-- Render arrow2.glb model with adjusted scale 0.1 -->
        <a-gltf-model 
          rotation="0 0 0" 
          position="0 0 0" 
          scale="1 1 1" 
          src="#arrow2Model" 
          animation-mixer>
        </a-gltf-model>
      </a-entity>

    </a-scene>
  </body>
</html>
